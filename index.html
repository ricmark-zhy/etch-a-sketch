<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch A Sketch</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>

    <!-- grid top buttons -->
    <div class="top-menu-container">
      <form>
        <label for="mode">Mode</label>
        <input type="text" id="mode_text" placeholder="View" value="View" size="2" readonly>
        <div class="help-button-container">
          <button type="button" id="mode_help_button">?</button>
          <div class="help-popup" id="help_popup">
            <p>Press D, draw mode</p>
            <p>Press S, erase mode</p>
            <p>Press A, view mode</p>
          </div>
        </div>
      </form>
      <form>
        <label for="grid-size" id="size_label"><span>(Min:16 Max:100 )</span></label>
        <input type="number" placeholder="16" id="size_input" max="100" min="16">
        <button type="button" id="generate">Generate Grid</button>
      </form>
    </div>

    <!-- The grid -->
    <div class="sketch-pad" id="sketch_pad"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
