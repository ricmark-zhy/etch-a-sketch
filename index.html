<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch A Sketch</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="sidebar-container">
    <h2>Help</h2>
    <ul>
      <li><p>Press A, View mode</p></li>
      <li><p>Press D, Paint mode</p></li>
      <li><p>Press S, Erase mode</p></li>
    </ul>
  </div>
  <header>
    <h1>Etch A Sketch </h1>
  </header>
  <main>

    <!-- grid top buttons -->
    <div class="top-menu-container">
      <form>
        <label for="mode_text">Mode</label>
        <input type="text" id="mode_text" placeholder="View" value="View" size="2" readonly>
      </form>
      <form>
        <label for="size_input" id="size_label"><span>(Min:16 Max:100)</span></label>
        <input type="number" placeholder="16" id="size_input" max="100" min="16">
        <button type="button" id="generate">Generate Grid</button>
      </form>
    </div>

    <!-- The grid -->
    <div class="sketch-pad" id="sketch_pad"></div>

  </main>
  <footer>
    &copy Ric Mark J.
  </footer>

  <script src="script.js"></script>
</body>
</html>
